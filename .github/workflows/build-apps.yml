# Builds the double-click apps (Windows and Mac) on GitHub's own computers.
#
# Run it by hand: repository > Actions > "Build apps" > Run workflow.
#   The finished zips appear under the run's "Artifacts".
# Or push a version tag (e.g. v1.0): the zips are also attached to a
#   GitHub Release with that name, ready to link to from the website.

name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # lets the workflow create the Release on a tag

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version.py matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $want = "${{ github.ref_name }}".TrimStart("v")
          $have = (Select-String -Path version.py -Pattern 'VERSION = "(.*)"').Matches[0].Groups[1].Value
          if ($have -ne $want) { throw "version.py says $have but the tag is v$want. Change VERSION in version.py to $want, commit, and tag again." }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller -c packaging/constraints.txt
      - name: Build the app
        run: pyinstaller --noconfirm rocket_sizing.spec
      - name: Quick check that it starts its server
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Rocket Engine Sizing Tool/Rocket Engine Sizing Tool.exe" -ArgumentList "--serve","8770" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8770/_stcore/health | Out-Null; $ok = $true } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "The packaged app's server did not start" }
      - name: Check that it can run the engine calculation
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist/Rocket Engine Sizing Tool/Rocket Engine Sizing Tool.exe" -ArgumentList "--selftest","`"$out`"" -PassThru -Wait
          if (Test-Path $out) { Get-Content $out } else { Write-Host "No self-test output was written." }
          if ($p.ExitCode -ne 0) { throw "The packaged app could not run the calculation (exit code $($p.ExitCode))" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Rocket Engine Sizing Tool" -DestinationPath "Rocket-Sizing-Tool-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          # GitHub zips artifacts itself, so upload the app folder (not the
          # zip) to avoid a zip inside a zip. Releases still get the zip.
          name: Rocket-Sizing-Tool-Windows
          path: dist/
      - name: Pretend the files came from an internet download
        # Windows marks downloaded files as "from another computer", which
        # used to stop the app from starting. Mark them the same way here so
        # the next step proves the app copes with it.
        shell: pwsh
        run: |
          Get-ChildItem "dist/Rocket Engine Sizing Tool" -Recurse -Filter *.dll | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
      - name: Open the app like a user would and check it fully loads
        shell: pwsh
        run: |
          function Note($kind, $title, $text) {
            $t = ($text -replace '%','%25') -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::$kind title=$title::$t"
          }
          $log = Join-Path $env:LOCALAPPDATA "Rocket Engine Sizing Tool\app.log"
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath "dist/Rocket Engine Sizing Tool/Rocket Engine Sizing Tool.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 240 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "\[loading\] step 5" -Quiet)) { $ok = $true }
          }
          Start-Sleep -Seconds 3
          $alive = -not $p.HasExited
          Get-Process -Name "Rocket Engine Sizing Tool" -ErrorAction SilentlyContinue | Stop-Process -Force
          $text = if (Test-Path $log) { (Get-Content $log -TotalCount 150) -join "`n" } else { "(no app.log was written)" }
          Write-Host $text
          if ($ok -and $alive) {
            Note "notice" "App test passed" "The app opened, finished loading and was still running.`n$text"
          } else {
            Note "error" "App test failed" "loaded=$ok still-running=$alive after $i s`n$text"
            throw "The app did not fully load"
          }
      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Rocket-Sizing-Tool-Windows.zip

  mac:
    # Apple Silicon (M-series) Mac. Built on an older macOS on purpose: an app
    # only runs on the macOS it was built on or newer.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Check version.py matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' version.py)
          if [ "$have" != "$want" ]; then
            echo "::error::version.py says $have but the tag is v$want. Change VERSION in version.py to $want, commit, and tag again."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a Fortran compiler (NASA CEA is written in Fortran)
        run: |
          brew install gcc
          echo "FC=$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller -c packaging/constraints.txt
      - name: Build the app
        run: pyinstaller --noconfirm rocket_sizing.spec
      - name: Check that it can run the engine calculation
        run: |
          APP="dist/Rocket Engine Sizing Tool.app/Contents/MacOS/Rocket Engine Sizing Tool"
          "$APP" --selftest "$PWD/selftest.txt" || code=$?
          cat selftest.txt 2>/dev/null || echo "No self-test output was written."
          if [ -n "$code" ]; then echo "::error::The packaged app could not run the calculation"; exit 1; fi
      - name: Report the oldest macOS the app runs on
        run: |
          oldest=$(find "dist/Rocket Engine Sizing Tool.app" -type f \( -name "*.dylib" -o -name "*.so" \) -exec vtool -show-build {} \; 2>/dev/null \
                   | awk '/minos/ {print $2}' | sort -V | tail -1)
          echo "::notice title=Oldest macOS supported::macOS $oldest or later"
      - name: Zip
        # ditto keeps the app bundle's links and signature intact
        run: ditto -c -k --keepParent "dist/Rocket Engine Sizing Tool.app" Rocket-Sizing-Tool-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Rocket-Sizing-Tool-Mac
          path: Rocket-Sizing-Tool-Mac.zip
      - name: Open the app like a user would and check it fully loads
        run: |
          LOG="$HOME/Library/Logs/Rocket Engine Sizing Tool/app.log"
          rm -f "$LOG"
          "dist/Rocket Engine Sizing Tool.app/Contents/MacOS/Rocket Engine Sizing Tool" &
          PID=$!
          ok=0
          for i in $(seq 1 240); do
            sleep 1
            kill -0 $PID 2>/dev/null || break
            if grep -q "\[loading\] step 5" "$LOG" 2>/dev/null; then ok=1; break; fi
          done
          sleep 3
          alive=0; kill -0 $PID 2>/dev/null && alive=1
          pkill -f "Rocket Engine Sizing Tool" || true
          text=$(head -150 "$LOG" 2>/dev/null || echo "(no app.log was written)")
          echo "$text"
          esc=$(printf '%s' "$text" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ $ok = 1 ] && [ $alive = 1 ]; then
            echo "::notice title=Mac app test passed::The app opened, finished loading and was still running.%0A$esc"
          else
            echo "::error title=Mac app test failed::loaded=$ok still-running=$alive after $i s%0A$esc"
            exit 1
          fi
      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Rocket-Sizing-Tool-Mac.zip
