# Builds the double-click apps on GitHub's own computers.
#
# Run it by hand: repository > Actions > "Build apps" > Run workflow.
#   The finished zips appear under the run's "Artifacts".
# Or push a version tag (e.g. v1.0): the zips are also attached to a
#   GitHub Release with that name, ready to link to from the website.

name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # lets the workflow create the Release on a tag

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version.py matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $want = "${{ github.ref_name }}".TrimStart("v")
          $have = (Select-String -Path version.py -Pattern 'VERSION = "(.*)"').Matches[0].Groups[1].Value
          if ($have -ne $want) { throw "version.py says $have but the tag is v$want. Change VERSION in version.py to $want, commit, and tag again." }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build the app
        run: pyinstaller --noconfirm rocket_sizing.spec
      - name: Quick check that it starts its server
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Rocket Engine Sizing Tool/Rocket Engine Sizing Tool.exe" -ArgumentList "--serve","8770" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8770/_stcore/health | Out-Null; $ok = $true } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "The packaged app's server did not start" }
      - name: Check that it can run the engine calculation
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist/Rocket Engine Sizing Tool/Rocket Engine Sizing Tool.exe" -ArgumentList "--selftest","`"$out`"" -PassThru -Wait
          if (Test-Path $out) { Get-Content $out } else { Write-Host "No self-test output was written." }
          if ($p.ExitCode -ne 0) { throw "The packaged app could not run the calculation (exit code $($p.ExitCode))" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Rocket Engine Sizing Tool" -DestinationPath "Rocket-Sizing-Tool-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Rocket-Sizing-Tool-Windows
          path: Rocket-Sizing-Tool-Windows.zip
      - name: Pretend the files came from an internet download
        # Windows marks downloaded files as "from another computer", which
        # used to stop the app from starting. Mark them the same way here so
        # the next step proves the app copes with it.
        shell: pwsh
        run: |
          Get-ChildItem "dist/Rocket Engine Sizing Tool" -Recurse -Filter *.dll | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
      - name: Open the app like a user would and check it fully loads
        shell: pwsh
        run: |
          function Note($kind, $title, $text) {
            $t = ($text -replace '%','%25') -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::$kind title=$title::$t"
          }
          $log = Join-Path $env:LOCALAPPDATA "Rocket Engine Sizing Tool\app.log"
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath "dist/Rocket Engine Sizing Tool/Rocket Engine Sizing Tool.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 240 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "\[loading\] step 5" -Quiet)) { $ok = $true }
          }
          Start-Sleep -Seconds 3
          $alive = -not $p.HasExited
          Get-Process -Name "Rocket Engine Sizing Tool" -ErrorAction SilentlyContinue | Stop-Process -Force
          $text = if (Test-Path $log) { (Get-Content $log -Tail 60) -join "`n" } else { "(no app.log was written)" }
          Write-Host $text
          if ($ok -and $alive) {
            Note "notice" "App test passed" "The app opened, finished loading and was still running.`n$text"
          } else {
            Note "error" "App test failed" "loaded=$ok still-running=$alive after $i s`n$text"
            throw "The app did not fully load"
          }
      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Rocket-Sizing-Tool-Windows.zip
